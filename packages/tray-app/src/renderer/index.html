<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Idasen desk controller</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Idasen desk</h1>
    <span id="connection-dot" class="dot"></span>
  </header>

  <section id="status-section">
    <div id="height-readout">-- cm</div>
    <div id="speed-readout"></div>
  </section>

  <section id="connect-section">
    <button id="scan-btn">Scan</button>
    <select id="device-select"></select>
    <button id="connect-btn">Connect</button>
  </section>

  <section id="controls-section">
    <button id="up-btn" title="Move up">▲</button>
    <button id="stop-btn" title="Stop">■</button>
    <button id="down-btn" title="Move down">▼</button>
  </section>

  <section id="move-section">
    <input id="height-input" type="number" min="62" max="127" step="0.5" placeholder="cm" />
    <button id="move-btn">Go</button>
  </section>

  <section id="presets-section">
    <div id="preset-list"></div>
    <div class="preset-add">
      <input id="preset-name" type="text" placeholder="preset name" />
      <button id="preset-add-btn">Save current as preset</button>
    </div>
  </section>

  <p id="error-line"></p>

  <script src="renderer.js"></script>
</body>
</html>
